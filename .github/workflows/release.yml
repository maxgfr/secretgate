name: Release

# Conventional-Commit-driven releases after successful CI on a push to `main`.
# semantic-release inspects the commits since the last release and, when they
# warrant one (feat -> minor, fix -> patch, `!`/BREAKING -> major):
#   - runs the full gate (typecheck / lint / test / reproducible bundles),
#   - computes the next version and syncs it across package.json / src/version.ts /
#     SKILL.md / CHANGELOG.md and rebuilds the bundles (scripts/sync-version.mjs),
#   - publishes the standalone skill bundles to GitHub (no npm package),
#   - compiles the Node-free binaries (Bun) the Homebrew tap installs, and
#     attaches them with their SHA256SUMS to the release,
#   - commits the bump back to `main` as `chore(release): <v> [skip ci]`,
#   - tags `v<version>` and creates the GitHub release with auto notes + tarball.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    # macOS: the release binaries include macOS ones, re-signed with codesign.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Check that the tested commit is still main
        id: head
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "current=$([ "$(git rev-parse HEAD)" = "$TESTED_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # semantic-release's prepare step compiles the standalone binaries.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate — typecheck / lint / test / reproducible bundles
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm test
          pnpm run check:build

      - name: Release (semantic-release — GitHub release only, no npm publish)
        if: steps.head.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
