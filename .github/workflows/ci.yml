name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20, 24]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build is reproducible (committed bundles + generated rules up to date)
        run: pnpm run check:build

      - name: Test (with coverage)
        run: pnpm run test:coverage

      - name: Smoke-run the committed bundle (offline, fake token via concat)
        run: pnpm run demo # asserts scan exits 1 on the fake token

  # The engine's rules are converted from gitleaks.toml (Go regex -> JS regex).
  # This job installs the REAL gitleaks binary and asserts both engines agree on
  # the fake-token fixtures — a machine check on regex-conversion fidelity.
  differential-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Differential test (JS engine vs real gitleaks on fixtures)
        run: SECRETGATE_DIFFERENTIAL=1 pnpm exec vitest run tests/engine/differential.test.ts

  # The whole distribution story: `npx skills add` installs a WORKING skill
  # (bundle included), and running that bundle's `install` wires the hooks and
  # actually blocks a secret — no npm package anywhere in the path.
  skills-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: skills add for Claude Code, Codex and OpenCode
        run: node tests/e2e/skills-install.mjs

  # Self-scan dogfood: the repo must not contain anything the engine flags.
  # Forces test fixtures to build fake tokens by concatenation and keeps
  # GitHub push protection quiet.
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: secretgate scans its own repo -> 0 findings
        # .secretgate.json (project allowlist, dogfood) covers the rule-database files
        run: node scripts/secretgate.mjs scan .

  live-agents:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        agent: [claude-code, codex, opencode]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned agent CLI
        shell: bash
        run: |
          case "${{ matrix.agent }}" in
            claude-code) npm install -g @anthropic-ai/claude-code@2.1.263 ;;
            codex) npm install -g @openai/codex@0.153.4 ;;
            opencode) npm install -g opencode-ai@1.18.29 ;;
          esac
      - name: Inspect real model-bound requests against loopback provider
        run: node tests/e2e/live-agents.mjs ${{ matrix.agent }}

  portable-runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.17.0, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node tests/e2e/runtime.mjs
